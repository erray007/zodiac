name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Bootstrap unit tests
        run: python -I -m unittest discover -v -s tools -p "test_*.py"
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test
        run: .tools/cmake/bin/cmake --workflow --preset windows
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-linux-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Install and select clang 18 with libc++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Show compiler version
        run: clang-18 --version
      - name: Bootstrap unit tests
        run: python -I -m unittest discover -v -s tools -p "test_*.py"
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test
        run: .tools/cmake/bin/cmake --workflow --preset linux
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  # The kit as users get it: an optimized (windows-release) build, tested, packaged as the portable zip and the setup wizard.
  kit-windows:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-windows-${{ hashFiles('tools/toolchain.json') }}
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Bootstrap
        run: python bootstrap.py
      - name: Build and test the release preset
        run: .tools/cmake/bin/cmake --workflow --preset windows-release
      # Secrets cannot be used in "if:", so this step turns "the certificate secret is set" into an environment flag.
      - name: Check for a signing certificate
        env:
          ZODIAC_SIGNING_CERT: ${{ secrets.ZODIAC_SIGNING_CERT }}
        run: |
          if ($env:ZODIAC_SIGNING_CERT) {
            "ZODIAC_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "A signing certificate is set: the setup will be signed."
          } else {
            "No signing certificate is set: the setup will be unsigned."
          }
      # ZODIAC_SIGNING_CERT is a base64 PFX file, ZODIAC_SIGNING_PASSWORD its password. The password stays in the packaging step's environment;
      # the sign command (ZODIAC_SIGN_TOOL) is a script that reads it from there. zodiac_zip runs it on the kit's executables and DLLs
      # (tools/sign_kit.py) before the zip and the setup are made, and Inno Setup runs it on the setup and its uninstaller (tools/build_installer.py).
      - name: Prepare signing
        if: env.ZODIAC_SIGNING == '1'
        env:
          ZODIAC_SIGNING_CERT: ${{ secrets.ZODIAC_SIGNING_CERT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'zodiac-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:ZODIAC_SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $script = Join-Path $env:RUNNER_TEMP 'zodiac-sign.cmd'
          "@`"$($signtool.FullName)`" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$pfx`" /p `"%ZODIAC_SIGNING_PASSWORD%`" %*" | Out-File -FilePath $script -Encoding ascii
          "ZODIAC_SIGN_TOOL=cmd.exe /d /s /c `"`"$script`" `$f`"" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package the zip and the setup
        env:
          ZODIAC_SIGNING_PASSWORD: ${{ secrets.ZODIAC_SIGNING_PASSWORD }}
        run: .tools/cmake/bin/cmake --build --preset windows-release --target zodiac_installer
      # A setup built from the script as it was before the rename (a test fixture, uploaded as its own artifact so the release job never sees it): kit-clean-machine installs it and upgrades it with the real one.
      - name: Build the old-named setup for the upgrade test
        run: |
          $setup = Get-ChildItem dist -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          & .tools/innosetup/ISCC.exe "/DZodiacVersion=$version" "/DKitDir=$((Resolve-Path dist/Zodiac).Path)" "/O$((Resolve-Path dist).Path)" packaging/test/zodiac-old-name.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Show package sizes
        run: |
          Get-ChildItem dist -File | ForEach-Object { "$($_.Name): $($_.Length) bytes" }
      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-kit
          path: |
            dist/zodiac-*-windows-x86_64.zip
            dist/zodiac-setup-*.exe
          if-no-files-found: error
      # A separate artifact, so the release job (which publishes every file of zodiac-kit) can never attach it.
      - name: Upload the old-named setup for the upgrade test
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-old-setup
          path: dist/zodiac-old-setup-*.exe
          if-no-files-found: error
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-kit-windows
          path: |
            build/**/Testing/**/*.log
            build/**/Testing/**/*.xml
          if-no-files-found: ignore

  # A fresh Windows machine with nothing but the kit: no checkout, no Python, no toolchain, and only the Windows system folders on PATH.
  kit-clean-machine:
    needs: kit-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the kit
        uses: actions/download-artifact@v4
        with:
          name: zodiac-kit
          path: ${{ runner.temp }}/zodiac-kit
      - name: Download the old-named setup
        uses: actions/download-artifact@v4
        with:
          name: zodiac-old-setup
          path: ${{ runner.temp }}/zodiac-old-setup
      - name: Portable zip in a folder with a space and a non-English letter
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $root = 'C:\Users\runneradmin\Zodiac Kit ş'
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-kit" -Filter 'zodiac-*-windows-x86_64.zip' | Select-Object -First 1
          if (-not $zip) { throw "The zip is missing from the artifact" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $root
          $zodiac = Join-Path $root 'Zodiac\bin\zodiac.exe'
          Set-Location -LiteralPath $root
          & $zodiac new hello
          if ($LASTEXITCODE -ne 0) { throw "zodiac new hello failed with exit code $LASTEXITCODE" }
          & $zodiac build hello --no-window
          if ($LASTEXITCODE -ne 0) { throw "zodiac build hello failed with exit code $LASTEXITCODE" }
          $hello = Join-Path $root 'hello\release\hello.exe'
          & $hello
          if ($LASTEXITCODE -ne 0) { throw "hello.exe failed with exit code $LASTEXITCODE" }
          $size = (Get-Item -LiteralPath $hello).Length
          "hello.exe ran and exited with 0. Size: $size bytes."
          # Size gate (spec 8.9): a core-only hello world release is at most 3 MB.
          if ($size -gt 3MB) { throw "hello.exe is $size bytes, more than the 3 MB limit" }
      # Two rounds. Round 1: .zs already belongs to another program (a fake ProgID); every option is installed, then uninstall must give .zs back and
      # remove everything else it added. Round 2: the user PATH already holds the kit's bin folder; uninstall must leave that entry, which it did not add.
      - name: Setup wizard, silent install and uninstall
        run: |
          $setup = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-kit" -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw "The setup is missing from the artifact" }
          "Setup size: $($setup.Length) bytes."
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{98CB20B5-1340-41F1-80E7-8FD0E99FA8BC}_is1'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Zodiac Game Toolkit'
          $oldMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Zodiac'
          $systemPath = $env:PATH
          function Get-RawUserPath { (Get-Item -LiteralPath 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') }
          function Set-RawUserPath([string]$value) { Set-ItemProperty -LiteralPath 'HKCU:\Environment' -Name Path -Value $value -Type ExpandString }
          function Install-Zodiac([string]$tasks, [string]$round, [string]$file = $setup.FullName, [string]$expectedName = 'Zodiac Game Toolkit') {
            $log = Join-Path $env:RUNNER_TEMP "zodiac-setup-$round.log"
            $process = Start-Process -FilePath $file -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/TASKS=`"$tasks`"", "/LOG=`"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $log; throw "The setup failed with exit code $($process.ExitCode)" }
            $app = (Get-ItemProperty -LiteralPath $uninstallKey).InstallLocation.TrimEnd('\')
            if (-not (Test-Path -LiteralPath (Join-Path $app 'bin\zodiac.exe'))) { throw "$app\bin\zodiac.exe is missing" }
            $displayName = (Get-ItemProperty -LiteralPath $uninstallKey).DisplayName
            if ($displayName -ne $expectedName) { throw "The uninstall entry is listed as '$displayName', not $expectedName" }
            Write-Host "Round ${round}: installed into $app, listed as $displayName"
            $app
          }
          function Uninstall-Zodiac([string]$app) {
            $process = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "The uninstaller failed with exit code $($process.ExitCode)" }
            # The uninstaller finishes from a copy of itself in the temp folder, so wait for the install folder to go.
            $deadline = (Get-Date).AddMinutes(2)
            while ((Test-Path -LiteralPath $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $app) { Get-ChildItem -LiteralPath $app -Recurse | ForEach-Object FullName; throw "$app is still there after uninstall" }
            if (Test-Path -LiteralPath $uninstallKey) { throw "$uninstallKey is still there after uninstall" }
            if (Test-Path -LiteralPath 'HKCU:\Software\Zodiac') { throw "HKCU\Software\Zodiac is still there after uninstall" }
          }

          # Round 1.
          New-Item -Path 'HKCU:\Software\Classes\.zs' -Force | Out-Null
          Set-ItemProperty -LiteralPath 'HKCU:\Software\Classes\.zs' -Name '(default)' -Value 'Fake.ZsEditor'
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 1
          $bin = Join-Path $app 'bin'
          # A new shell gets PATH from the registry, not from this process: run zodiac with the user PATH the setup wrote and the system folder only.
          $userPath = (Get-ItemProperty -LiteralPath 'HKCU:\Environment').Path
          if (@($userPath -split ';' | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "The user PATH does not hold $bin exactly once: $userPath" }
          $env:PATH = "$userPath;$env:SystemRoot\System32"
          $reported = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command 'zodiac --version'
          if ($LASTEXITCODE -ne 0 -or $reported -ne "zodiac $version") { throw "zodiac --version in a new shell said '$reported' (exit code $LASTEXITCODE)" }
          $env:PATH = $systemPath
          "zodiac --version in a new shell: $reported"
          $progId = (Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetValue('')
          if ($progId -ne 'Zodiac.Script') { throw "HKCU\Software\Classes\.zs is '$progId', not Zodiac.Script" }
          $open = (Get-Item -LiteralPath 'HKCU:\Software\Classes\Zodiac.Script\shell\open\command').GetValue('')
          if ($open -ne "`"$bin\zodiac.exe`" run `"%1`"") { throw "The open command is '$open'" }
          $verb = Get-Item -LiteralPath 'HKCU:\Software\Classes\SystemFileAssociations\.zs\shell\zodiacbuild'
          $build = (Get-Item -LiteralPath 'HKCU:\Software\Classes\SystemFileAssociations\.zs\shell\zodiacbuild\command').GetValue('')
          if ($verb.GetValue('') -ne 'Build with Zodiac' -or $build -ne "`"$bin\zodiacw.exe`" build `"%1`"") { throw "The build verb is '$($verb.GetValue(''))' running '$build'" }
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $menu $shortcut))) { throw "The Start menu shortcut $menu\$shortcut is missing" }
          }
          if (Test-Path -LiteralPath $oldMenu) { throw "A clean install made the old Start menu folder $oldMenu" }
          "Association, right-click verb and Start menu shortcuts are there."
          Uninstall-Zodiac $app
          $pathAfter = Get-RawUserPath
          if ($pathAfter -ne $pathBefore) { throw "The user PATH is '$pathAfter' after uninstall, but was '$pathBefore' before install" }
          $progId = (Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetValue('')
          if ($progId -ne 'Fake.ZsEditor') { throw "HKCU\Software\Classes\.zs is '$progId' after uninstall, not the earlier Fake.ZsEditor" }
          if ((Get-Item -LiteralPath 'HKCU:\Software\Classes\.zs').GetSubKeyNames().Count -ne 0) { throw "HKCU\Software\Classes\.zs still has subkeys after uninstall" }
          foreach ($key in 'HKCU:\Software\Classes\Zodiac.Script', 'HKCU:\Software\Classes\SystemFileAssociations\.zs', $menu) {
            if (Test-Path -LiteralPath $key) { throw "$key is still there after uninstall" }
          }
          "Round 1: uninstall gave .zs back to Fake.ZsEditor and removed the folder, the PATH entry, the ProgID, the verb and the shortcuts."
          Remove-Item -LiteralPath 'HKCU:\Software\Classes\.zs' -Recurse

          # Round 2: the default per-user folder, already on the user PATH.
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\Zodiac\bin'
          $original = Get-RawUserPath
          Set-RawUserPath "$original;$bin"
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath' 2
          if ((Join-Path $app 'bin') -ne $bin) { throw "Round 2 installed into $app, not the default folder" }
          if (Test-Path -LiteralPath $oldMenu) { throw "A clean install made the old Start menu folder $oldMenu" }
          if ((Get-RawUserPath) -ne $pathBefore) { throw "The setup changed a user PATH that already held $bin" }
          Uninstall-Zodiac $app
          if ((Get-RawUserPath) -ne $pathBefore) { throw "Uninstall removed the PATH entry $bin that the setup did not add" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\.zs') { throw "HKCU\Software\Classes\.zs exists although associate was not chosen" }
          Set-RawUserPath $original
          "Round 2: the PATH entry the user already had was kept."

          # Round 3: the upgrade a user with the old-named setup really does. The old setup (packaging/test/zodiac-old-name.iss) installs everything, the user
          # keeps a file in its Start menu folder, then the real setup installs over it: same AppId, so one uninstall entry, renamed, with the shortcuts moved.
          $oldSetup = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\zodiac-old-setup" -Filter 'zodiac-old-setup-*.exe' | Select-Object -First 1
          if (-not $oldSetup) { throw "The old-named setup is missing from the artifact" }
          $pathBefore = Get-RawUserPath
          $app = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 3 $oldSetup.FullName "Zodiac $version"
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $oldMenu $shortcut))) { throw "The old setup did not make the shortcut $oldMenu\$shortcut" }
          }
          if (Test-Path -LiteralPath $menu) { throw "The old setup made the new Start menu folder $menu" }
          $notes = Join-Path $oldMenu 'my notes.txt'
          Set-Content -LiteralPath $notes -Value 'The user put this here.'
          $upgraded = Install-Zodiac 'addtopath,associate,buildmenu,shortcuts' 3 $setup.FullName 'Zodiac Game Toolkit'
          if ($upgraded -ne $app) { throw "The upgrade went to $upgraded, not over $app" }
          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entries = @(Get-ChildItem -LiteralPath $uninstallRoot | Where-Object { $_.PSChildName -like '*98CB20B5-1340-41F1-80E7-8FD0E99FA8BC*' })
          if ($entries.Count -ne 1) { throw "There are $($entries.Count) uninstall entries for the AppId after the upgrade, not 1" }
          foreach ($shortcut in 'Zodiac manual.lnk', 'Zodiac examples.lnk') {
            if (-not (Test-Path -LiteralPath (Join-Path $menu $shortcut))) { throw "The upgrade did not make the shortcut $menu\$shortcut" }
            if (Test-Path -LiteralPath (Join-Path $oldMenu $shortcut)) { throw "The upgrade left the old shortcut $oldMenu\$shortcut" }
          }
          if (-not (Test-Path -LiteralPath $notes)) { throw "The upgrade deleted the user's file $notes" }
          $bin = Join-Path $app 'bin'
          if (@((Get-RawUserPath) -split ';' | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "The user PATH does not hold $bin exactly once after the upgrade: $(Get-RawUserPath)" }
          "Round 3: the upgrade renamed the entry, moved the shortcuts, kept one entry and the PATH entry once, and kept the user's file."
          Remove-Item -LiteralPath $notes
          Uninstall-Zodiac $app
          if ((Get-RawUserPath) -ne $pathBefore) { throw "The user PATH is '$(Get-RawUserPath)' after uninstalling the upgraded kit, but was '$pathBefore' before the old setup" }
          foreach ($key in $menu, $oldMenu, 'HKCU:\Software\Classes\.zs', 'HKCU:\Software\Classes\Zodiac.Script', 'HKCU:\Software\Classes\SystemFileAssociations\.zs') {
            if (Test-Path -LiteralPath $key) { throw "$key is still there after uninstalling the upgraded kit" }
          }
          "Round 3: uninstall after the upgrade left neither Start menu folder, the PATH as before, and no .zs keys."

  # Tags v* publish the tested packages as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kit-clean-machine, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the kit
        uses: actions/download-artifact@v4
        with:
          name: zodiac-kit
          path: kit
      - name: Check the tag against the kit version
        run: |
          $setup = Get-ChildItem -LiteralPath kit -Filter 'zodiac-setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw "The setup is missing from the artifact" }
          $version = $setup.BaseName -replace '^zodiac-setup-', ''
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "The tag $env:GITHUB_REF_NAME does not match the kit version $version (PROJECT_VERSION in CMakeLists.txt): tag v$version instead" }
          "Tag $env:GITHUB_REF_NAME matches the kit version $version."
          if (-not (Test-Path -LiteralPath "kit/zodiac-$version-windows-x86_64.zip")) { throw "The portable zip is missing from the artifact" }
          # Only the zip and the setup are released: anything else in the artifact (such as a test setup) must not be published.
          $unexpected = @(Get-ChildItem -LiteralPath kit -Recurse -File | Where-Object { $_.Name -cne "zodiac-setup-$version.exe" -and $_.Name -cne "zodiac-$version-windows-x86_64.zip" })
          if ($unexpected.Count -ne 0) { throw "The kit artifact holds files that are not released: $($unexpected.Name -join ', ')" }
      - name: Write SHA256SUMS
        run: |
          $lines = Get-ChildItem -LiteralPath kit -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path kit) 'SHA256SUMS'), ($lines -join "`n") + "`n")
          Get-Content -LiteralPath kit/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem -LiteralPath kit -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Zodiac $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "The Zodiac kit: the setup wizard (zodiac-setup-<version>.exe) or the portable zip. SHA256SUMS lists the SHA-256 of both."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
